# Variant sweep on the fork's free Windows runners: one job per folder ci-variants/<job>/, which holds replacement
# files at their repo paths (one variant of each function per job). Each job overlays its folder, builds, uploads
# its DLL/PDB as artifact dll-<job>; win/cisweep.py scores them locally with reccmp.
name: ci-variants
on:
  push:
    branches: ['civar/**']
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.l.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: echo "jobs=$(ls ci-variants | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  build:
    needs: list
    runs-on: windows-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJson(needs.list.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: overlay variant files
        shell: cmd
        run: python -c "import shutil,os,sys; d='ci-variants/'+sys.argv[1]; shutil.copytree(d,'.',dirs_exist_ok=True); [print(os.path.join(r,f)) for r,_,fs in os.walk(d) for f in fs]" ${{ matrix.job }}
      - name: jom
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.qt.io/official_releases/jom/jom_1_1_4.zip -OutFile jom.zip
          Expand-Archive jom.zip -DestinationPath "$env:RUNNER_TEMP\jom"
      - name: flags
        shell: cmd
        run: |
          python tools\reimplementation-control\enable_reimplemented_data.py
          python tools\reimplementation-helper\batch\enable_local_functions.py
      - name: build
        shell: cmd
        run: |
          call .\cmakew.bat --preset RelWithDebInfo "-DCMAKE_MAKE_PROGRAM=%RUNNER_TEMP%\jom\jom.exe"
          call .\cmakew.bat --build --preset RelWithDebInfo --target OpenSHC.dll
      - uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.job }}
          path: |
            build-RelWithDebInfo/DLL/OpenSHC.dll
            build-RelWithDebInfo/DLL/OpenSHC.pdb
          retention-days: 3
